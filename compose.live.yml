services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.live
    env_file: .local/runtime.env
    environment:
      PG_DSN: postgresql://bracket:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/bracket
      ENVIRONMENT: PRODUCTION
      API_PREFIX: /api
      SERVE_FRONTEND: "false"
      ALLOW_USER_REGISTRATION: "false"
      ALLOW_DEMO_USER_REGISTRATION: "false"
    ports:
      - "127.0.0.1:8400:8400"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bracket
      POSTGRES_USER: bracket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - tournament_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bracket -d bracket"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  tournament_data:
